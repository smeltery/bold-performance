name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
      - uses: flox/install-flox-action@5bb9eaaffbeaa699a8251a1ae21ecf4c8e0e37d4
        with:
          version: 1.18.1
      - run: flox activate -- bash -c 'bun install --frozen-lockfile && bun run build'
      - name: Publish website archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tar -czf bold-performance.tar.gz -C dist .
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" bold-performance.tar.gz --clobber
          else
            gh release create "$RELEASE_TAG" bold-performance.tar.gz --verify-tag --generate-notes
          fi
